name: heartbeat

# GitHub drops scheduled runs under load (observed repeatedly: 2026-10-25 the
# 21:37 UTC cron never fired; 2026-10-26 both the 11:37 and 13:37 crons were
# dropped, and a 3h55m-from-completion threshold could never catch a drop in
# a 4h schedule — max observable idle is only ~3h20m). Since v0.4 the
# heartbeat is the CADENCE DRIVER, not just a safety net: whenever the arena
# has been idle for 1h+ since its last run completed and nothing is in
# flight, dispatch one. Six crons are the guaranteed floor; the heartbeat
# fills every other gap the scheduler loses. Measured steady state with
# ~95-100 min runs: ~8-12 runs/day at $0 — the free runners never idle long.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch arena if idle > 1h
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          idle_secs=3600   # 1h: drive utilization, don't just catch drops

          dispatch() {
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/arena.yml/dispatches" \
              -d '{"ref":"main","inputs":{}}'
            echo "arena run dispatched (catch-up)"
          }

          # last arena run regardless of status; tolerate transient API errors.
          # Idle is measured from the run's updated_at (completion time) when
          # completed: a 90-min run must not burn its own idle window, or the
          # heartbeat fires early and double-runs a slot (observed 2026-10-26
          # 02:01 and 10:06 UTC — both landed on top of delayed crons).
          resp=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/arena.yml/runs?per_page=1" || true)
          last=$(echo "$resp" | python3 -c "import json,sys;d=json.load(sys.stdin);r=(d.get('workflow_runs') or [None])[0];print((r['updated_at']+' '+r['status']+' '+(r['conclusion'] or 'none')) if r else 'none')" 2>/dev/null || echo "none")

          last_upd=$(echo "$last" | awk '{print $1}')
          last_status=$(echo "$last" | awk '{print $2}')

          if [ "$last_upd" = "none" ] || [ -z "$last_upd" ]; then
            echo "no arena runs on record — dispatching the first"
            dispatch
            exit 0
          fi

          now=$(date +%s)
          ref_ts=$(date -d "$last_upd" +%s)
          age=$((now - ref_ts))
          echo "last arena activity: $last_upd (status=$last_status, age=$((age / 60))m)"

          if [ "$last_status" != "completed" ]; then
            echo "a run is in flight — nothing to do"
            exit 0
          fi

          if [ "$age" -lt "$idle_secs" ]; then
            echo "arena is fresh — nothing to do"
            exit 0
          fi

          echo "arena idle past 1h — filling the gap (cron dropped, or the fleet is simply free)"
          dispatch
