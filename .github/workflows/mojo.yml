name: mojo-brain

# The Mojo brain is a first-class target. The Python brain is the reference
# oracle. This job is best-effort: if Mojo's toolchain moves under us, the
# arena still runs — the failure is recorded, not hidden. The status receipt
# is committed back so the repo shows the toolchain's pulse.

on:
  workflow_dispatch:
  schedule:
    - cron: "3 22 * * 0"

permissions:
  contents: write

concurrency:
  group: mojo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Mojo (modular)
        run: |
          curl -sSf https://get.modular.com | MODULAR_AUTH=${{ secrets.MODULAR_TOKEN || '' }} sh -
          modular install mojo || true
      - name: Build + smoke the Mojo brain
        run: |
          mojo --version
          mojo build brain/evolve.mojo -o /tmp/arena-brain
          # differential smoke: tiny population, genetics kernel only
          python3 tools/gen_seed.py --out /tmp/smoke_seed.txt --per-tribe 1
          /tmp/arena-brain --pop /tmp/smoke_seed.txt --gens 2 --out /tmp/mojo_out.txt
          head -4 /tmp/mojo_out.txt
      - name: Commit status receipt
        if: always()
        run: |
          if [ -f /tmp/mojo_out.txt ]; then
            echo "mojo brain: OK $(date -u) — smoke output $(wc -l < /tmp/mojo_out.txt) lines" > MOJO-STATUS.md
          else
            echo "mojo brain: build/run failed $(date -u) — python brain remains canonical" > MOJO-STATUS.md
          fi
          git config user.name "codec-arena-bot"
          git config user.email "arena@limitlessprojects.dev"
          git add MOJO-STATUS.md
          git commit -m "mojo: toolchain status $(date -u +%F) [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push || true
