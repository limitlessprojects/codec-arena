name: arena

on:
  workflow_dispatch:
    inputs:
      gens:
        description: "generations per shard"
        default: "28"
      pop:
        description: "population per shard"
        default: "256"
      shards:
        description: "number of parallel shards (max 20)"
        default: "20"
      screens:
        description: "surrogate screens per generation (0 = legacy GA path)"
        default: "2650000000"
  schedule:
    # Six arena runs per day, 4h apart, off-peak minute (:37 — GitHub delays
    # top-of-hour crons hardest). The heartbeat workflow is the catch-up net:
    # if GitHub drops one of these crons, the missed run is dispatched late.
    - cron: "37 1,5,9,13,17,21 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: arena-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.calc.outputs.shards }}
      gens: ${{ steps.calc.outputs.gens }}
      pop: ${{ steps.calc.outputs.pop }}
      screens: ${{ steps.calc.outputs.screens }}
    steps:
      - id: calc
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            N=${{ inputs.shards }}; G=${{ inputs.gens }}; P=${{ inputs.pop }}; S=${{ inputs.screens }}
          else
            N=20; G=28; P=256; S=2650000000
          fi
          echo "shards=[$(seq -s, 0 $((N-1)))]" >> "$GITHUB_OUTPUT"
          echo "gens=$G"     >> "$GITHUB_OUTPUT"
          echo "pop=$P"      >> "$GITHUB_OUTPUT"
          echo "screens=$S"  >> "$GITHUB_OUTPUT"

  evolve:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 20
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Build arena (ReleaseFast, v3 SIMD — hosted runners all support AVX2)
        run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3
      - name: Unit tests (genome parsing, surrogate layout, scoring)
        run: zig build test -Dcpu=x86_64_v3
      - name: Generate deterministic corpus
        run: python3 tools/gen_corpus.py --out corpus/raw
      - name: numpy guard (surrogate refits; optional but preferred)
        run: python3 -c "import numpy" 2>/dev/null || pip install -q numpy
      - name: Seed anchor target if absent
        run: |
          if [ ! -f benchmarks/baseline.json ]; then
            mkdir -p benchmarks
            echo '{"target_psnr": 35.4, "note": "seed anchor; anchor job refines"}' > benchmarks/baseline.json
          fi
      - name: Evolve shard ${{ matrix.shard }}
        run: |
          mkdir -p out
          python3 brain/evolve.py \
            --shard ${{ matrix.shard }} \
            --gens ${{ needs.plan.outputs.gens }} \
            --pop ${{ needs.plan.outputs.pop }} \
            --elite 8 --seed ${{ github.run_id }} \
            --screens ${{ needs.plan.outputs.screens }} \
            --threads 4 \
            --zig zig-out/bin/arena --corpus corpus/raw \
            --out-dir out/shard-${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: out/shard-${{ matrix.shard }}/

  anchor:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v3
      - run: python3 tools/gen_corpus.py --out corpus/raw
      - name: Install ffmpeg (not on 24.04 runner image)
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Benchmark real codecs (x264/x265/SVT-AV1/libaom)
        run: python3 tools/anchor.py --out out_baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: out_baseline.json

  merge:
    needs: [evolve, anchor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage artifacts
        run: |
          mkdir -p stage
          for d in artifacts/shard-*; do
            s=$(basename "$d" | sed 's/shard-//')
            mkdir -p "stage/shard-$s"
            cp "$d"/* "stage/shard-$s/" 2>/dev/null || true
          done
          cp artifacts/baseline/out_baseline.json stage/baseline.json 2>/dev/null || true
          ls stage | head
      - name: Merge + report
        id: merge
        run: |
          python3 tools/merge_results.py --in-dir stage
          echo "evals=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['lifetime_evals'])")" >> "$GITHUB_OUTPUT"
          echo "search=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['search_evals'])")" >> "$GITHUB_OUTPUT"
      - name: Commit state (conflict-proof merge-and-push)
        run: |
          git config user.name "codec-arena-bot"
          git config user.email "arena@limitlessprojects.dev"
          ok=""
          for i in 1 2 3 4 5 6; do
            # Merge always computes from FRESH origin state: if another run
            # pushed counters meanwhile, they are preserved and ours
            # accumulate on top (merge_results adds deltas). A rebase
            # conflict is structurally impossible.
            git fetch origin main
            git reset --hard origin/main
            python3 tools/merge_results.py --in-dir stage
            EV=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['lifetime_evals'])")
            SE=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['search_evals'])")
            git add LEADERBOARD.md LESSONS.md state/ halloffame/ benchmarks/ 2>/dev/null || true
            git commit -m "arena: run ${{ github.run_id }} — oracle $EV, search $SE [skip ci]" || echo "nothing to commit"
            if git push; then ok=1; break; fi
            echo "attempt $i lost the push race; re-merging on fresh origin"
            sleep $((10 + i * 10))
          done
          if [ -z "$ok" ]; then
            echo "FATAL: state push failed after 6 attempts — counters would be lost"
            git status -sb
            exit 1
          fi
      - name: Champion report (issue only when a new global champion is crowned)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          new_id=$(python3 -c "import json;print(json.load(open('halloffame/champion.json'))['id'])" 2>/dev/null || echo "")
          prev_id=$(git show origin/main:halloffame/champion.json 2>/dev/null | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])" 2>/dev/null || echo "")
          echo "global champion: $prev_id -> $new_id"
          if [ -z "$new_id" ] || [ "$new_id" = "$prev_id" ]; then
            echo "no new global champion this run — state is committed, no issue needed"
            exit 0
          fi
          echo "NEW CHAMPION bot $new_id — posting report"
          EV=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['lifetime_evals'])")
          SE=$(python3 -c "import json;print(json.load(open('state/lifetime_evals.json'))['search_evals'])")
          {
            echo "## New Global Champion — bot $new_id (run ${{ github.run_id }})"
            echo ""
            echo "Oracle evaluations: **$EV**"
            echo "Candidate evaluations (all instruments): **$SE**"
            echo ""
            echo '```'
            tail -40 LEADERBOARD.md
            echo '```'
            echo ""
            echo "Latest lessons:"
            echo '```'
            tail -20 LESSONS.md 2>/dev/null || echo "(none yet)"
            echo '```'
          } > report.md
          gh issue create --title "New Global Champion — bot $new_id (run ${{ github.run_id }})" \
             --body-file report.md --label arena-report || true
